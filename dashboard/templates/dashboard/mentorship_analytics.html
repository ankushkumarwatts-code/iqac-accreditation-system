<!DOCTYPE html>
<html>
<head>
    <title>Mentorship Load Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .under {
            background-color: #ffeaa7;
        }

        .balanced {
            background-color: #55efc4;
        }

        .over {
            background-color: #ff7675;
        }
    </style>
</head>

<body>

<h1>Mentorship Load Analytics Dashboard</h1>

<table>
    <tr>
        <th>Faculty Name</th>
        <th>Department</th>
        <th>Total Students</th>
        <th>Placed Students</th>
        <th>Average CGPA</th>
        <th>Load Status</th>
    </tr>

    {% for f in data %}
    <tr class="
        {% if f.load_status == 'Underutilized' %}under
        {% elif f.load_status == 'Balanced' %}balanced
        {% else %}over
        {% endif %}
    ">
        <td>{{ f.faculty }}</td>
        <td>{{ f.department }}</td>
        <td>{{ f.total_students }}</td>
        <td>{{ f.placed }}</td>
        <td>{{ f.avg_cgpa }}</td>
        <td>{{ f.load_status }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
