<!DOCTYPE html>
<html>
<head>
    <title>IQAC Accreditation Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Header -->
    <div class="card shadow p-4 mb-4">
        <h2 class="text-primary">{{ institution.name }}</h2>
        <p>Established: {{ institution.established_year }}</p>
        <p>Affiliated to: {{ institution.affiliated_university }}</p>
        <h4 class="text-success">NAAC Grade: {{ institution.naac_grade }}</h4>
    </div>

    <!-- KPI Cards -->
    <div class="row">

        <div class="col-md-4">
            <div class="card text-center shadow p-3">
                <h3>{{ department_count }}</h3>
                <p>Departments</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow p-3">
                <h3>{{ faculty_count }}</h3>
                <p>Total Faculty</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow p-3">
                <h3>{{ phd_count }}</h3>
                <p>PhD Faculty</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
