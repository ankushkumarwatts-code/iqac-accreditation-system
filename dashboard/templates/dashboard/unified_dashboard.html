<!DOCTYPE html>
<html>

<head>

<title>Institutional Command Center</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
background-color:#f4f6f9;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:30px;
border-radius:8px;
}

canvas{
margin-top:20px;
}

.metrics{
display:flex;
gap:20px;
margin-bottom:30px;
}

.metric-card{
background:white;
padding:20px;
border-radius:8px;
width:200px;
text-align:center;
}

</style>

</head>

<body>

<h1>Institutional Command Center</h1>


<div class="metrics">

<div class="metric-card">
<h3>NAAC Score</h3>
<p>{{ naac_score }}</p>
</div>

<div class="metric-card">
<h3>NBA Score</h3>
<p>{{ nba_score }}</p>
</div>

<div class="metric-card">
<h3>Health Index</h3>
<p>{{ health_index }}</p>
</div>

<div class="metric-card">
<h3>Risk Level</h3>
<p>{{ risk_level }}</p>
</div>

</div>


<div class="card">

<h2>NAAC Criteria Performance</h2>

<canvas id="naacChart"></canvas>

</div>


<div class="card">

<h2>Department Strength Comparison</h2>

<canvas id="deptChart"></canvas>

</div>



<script>


// ==============================
// NAAC DATA
// ==============================

const criteriaLabels = [

{% for c in criteria_performance %}

"{{ c.criteria }}",

{% endfor %}

];

const criteriaValues = [

{% for c in criteria_performance %}

{{ c.score }},

{% endfor %}

];


// NAAC CHART

new Chart(

document.getElementById("naacChart"),

{

type:"bar",

data:{

labels:criteriaLabels,

datasets:[{

label:"NAAC Criteria Score",

data:criteriaValues

}]

},

options:{

responsive:true,

scales:{
y:{
beginAtZero:true,
max:100
}
}

}

}

);


// ==============================
// DEPARTMENT DATA
// ==============================

const deptLabels = [

{% for d in department_strength %}

"{{ d.department }}",

{% endfor %}

];


const deptValues = [

{% for d in department_strength %}

{{ d.score }},

{% endfor %}

];



// DEPARTMENT CHART

new Chart(

document.getElementById("deptChart"),

{

type:"bar",

data:{

labels:deptLabels,

datasets:[{

label:"Department Performance",

data:deptValues

}]

},

options:{

responsive:true,

scales:{
y:{
beginAtZero:true,
max:100
}
}

}

}

);


</script>


</body>

</html>
